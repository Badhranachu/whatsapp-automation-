server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 6m; # photo uploads are limited to 5 MB

  # The browser only talks to this origin; API, admin and the Meta webhook go to the
  # backend container by its compose service name.
  location ~ ^/(api|admin|webhook) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # The service worker must always be re-checked so updates are picked up
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Built files have hashed names and can be cached for a long time
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Public demo (/stage): a separate mini-app built into dist/stage. No login, dummy data only.
  # Redirects must be relative: this container listens on port 3000 behind the host proxy, so a full address
  # built here would wrongly become http://<domain>:3000/... (unreachable from outside).
  absolute_redirect off;
  location = /stage {
    return 302 /stage/;
  }
  location /stage/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /stage/ {
    try_files $uri /stage/index.html;
  }

  # Single-page app: unknown paths load index.html
  location / {
    try_files $uri /index.html;
  }
}
